      /* Remember what was actually painted, not what the probe assumes: the
         robot's pigment changes with the dance clip and with the departure's
         colour handoff, and an assertion that only knows `#e5e5e7` would
         silently measure zero. */
      lastRobotPaint = { body: body, alpha: +visual.alpha.toFixed(3), scale: +visual.scale.toFixed(3),
                         colorMix: visual.color === null ? null : +visual.color.toFixed(3),
                         cy: +cy.toFixed(2), canvas: canvas.clientWidth + 'x' + canvas.clientHeight, ok: ok,
                         at: +now().toFixed(3), departAt: +robot.departAt.toFixed(3),
                         departProgress: robot.depart
                           ? +clamp01((now() - robot.departAt) / DEPARTURE_DURATION).toFixed(3) : null,
                         n: (lastRobotPaint ? lastRobotPaint.n : 0) + 1 };
      if (!ok) robot.reason = 'draw-failed';
    }


    // ---- the pill's height, reported to the host ---------------------
    /* The window is sized from OrbitLayout, not from a lamp tally: upstream's
       restCapsuleHeight is `orbitLayout.height + 24` (RootView.swift:557-560),
       which is why the shell and the disks cannot disagree while a brush flies
       (docs/motion-continuity.md:15). Points, like everything else here; the
       host scales them. */
    let reportedOrbit = -1, reportedAnim = null, reportedIdle = null;
    function report() {
      const height = layHeight(model.layout);
      /* What the host is told is what the probe reports: the rounded value is
         the one that was actually sent, and the one the window is sized from. */
      const rounded = Math.round(height * 100) / 100;
      const anim = animating();
      const idle = showsRobot();
      if (Math.abs(rounded - reportedOrbit) < 0.02 && anim === reportedAnim && idle === reportedIdle) return;
      reportedOrbit = rounded;
      reportedAnim = anim;
      reportedIdle = idle;
      send({ type: 'rest', orbit: rounded, anim, idle });
    }

    // ---- self-test / capture hooks -----------------------------------
    /* `state()` and `ink()` report what was really painted: the canvas is read
       back, so an assertion is about pixels, not about a class name or a flag.
       `pin`/`frameAt`/`advance` make a frame reproducible (upstream's renderDate,
       StatusOrbit.swift:499), and `hold` stops the completion clock so the phase
       under test cannot be overtaken by a real timer. */
    const probe = {
      state() {
        return {
          layout: Object.assign({}, model.layout),
          target: Object.assign({}, model.target),
          height: layHeight(model.layout),
          reported: reportedOrbit,
          animating: animating(),
          reduced: reduced(),
          spinActive: spinActive(),
          morphing: false,
          flight: model.flight ? {
            outcome: model.flight.outcome, failed: model.flight.failed,
            decision: model.flight.decision, busyBefore: model.flight.busyBefore,
            destinationBefore: model.flight.destinationBefore,
            returnsToRunning: model.flight.returnsToRunning,
            elapsed: now() - model.flight.startedAt,
          } : null,
          reply: model.reply ? {
            busyBefore: model.reply.busyBefore, travelling: model.reply.travelling,
            duration: model.reply.duration, elapsed: now() - model.reply.startedAt,
          } : null,
          queued: model.pendingFlights.length,
          pendingReply: model.pendingReply,
          /* The live motion/reply frames, so a captured still or a failing
             assertion can be read as numbers instead of guessed at. */
          progress: model.flight
            ? +clamp01((now() - model.flight.startedAt) / FLIGHT_DURATION).toFixed(3) : null,
          motion: model.flight ? (() => {
            const m = motionFrame(clamp01((now() - model.flight.startedAt) / FLIGHT_DURATION),
                                  model.flight.failed, model.flight.returnsToRunning, model.flight.angle);
            return { distance: +m.distance.toFixed(2), tail: +m.tailLength.toFixed(2),
                     tint: +m.tint.toFixed(3), resultOpacity: +m.resultOpacity.toFixed(3),
                     arrived: m.arrived, returning: m.returning, returned: m.returned };
          })() : null,
          replyFrame: model.reply ? (() => {
            const f = returnFrame(model.reply.progress(now()), model.reply.angle);
            return { progress: +model.reply.progress(now()).toFixed(3), distance: +f.distance.toFixed(2),
                     fill: +f.fill.toFixed(3), countMix: +f.countMix.toFixed(3), collapse: +f.collapse.toFixed(3) };
          })() : null,
          counts: { busy: busyCount(), completed: completedUnread(), failed: failedRows().length,
                    decision: needsAction() ? 1 : 0 },
          retained: { busy: model.retainedBusy, success: model.retainedSuccess,
                      failure: model.retainedFailure },
          dpr,
          pinned: pinned,
          /* The page's own clock, so a test that wants "0.25 s after NOW" can
             pin to an absolute instant instead of guessing the epoch. */
          now: +now().toFixed(3),
          flightStart: model.flight ? +model.flight.startedAt.toFixed(3) : null,
          flightElapsed: model.flight ? +(now() - model.flight.startedAt).toFixed(3) : null,
          canvas: { w: canvas.clientWidth, h: canvas.clientHeight },
          robot: {
            shows: showsRobot(),
            visibility: +robot.visibility.toFixed(4),
            depart: robot.depart,
            live: robot.live,
            action: director.action,
            display: !!robot.display,
            ready: RobotPose.ready,
            error: RobotPose.error,
            reason: robot.reason,
          },
        };
      },

      /* The slot list, in the macOS order, as the old DOM probe reported it. */
      lampList() {
        const out = [];
        if (needsAction()) out.push('decision:!');
        if (completedUnread() > 0) out.push('completed:' + completedUnread());
        if (busyCount() > 0) out.push('running:' + busyCount());
        if (failedRows().length > 0) out.push('failed:' + failedRows().length);
        return out;
      },

      /* Read the painted canvas back and classify its pixels against the four
         tokens. `bbox` is in CSS px with the origin at the canvas' top-left. */
      ink() {
        const w = canvas.width, h = canvas.height;
        if (!w || !h || !canvas.clientWidth) return { error: 'no-bitmap' };
        const data = ctx.getImageData(0, 0, w, h).data;
        const refs = { green: GREEN, red: RED, amber: AMBER, blue: BLUE, black: [0, 0, 0], white: [1, 1, 1] };
        const out = {};
        for (const key of Object.keys(refs)) {
          out[key] = { n: 0, minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9, sumX: 0, sumY: 0 };
        }
        const scale = 1 / dpr;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const a = data[i + 3] / 255;
            if (a < 0.25) continue;
            const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
            let best = null, bestD = 1e9;
            for (const key of Object.keys(refs)) {
              const c = refs[key];
              const d = (r - c[0]) * (r - c[0]) + (g - c[1]) * (g - c[1]) + (b - c[2]) * (b - c[2]);
              if (d < bestD) { bestD = d; best = key; }
            }
            if (bestD > 0.12) continue;
            const o = out[best];
            o.n++;
            const cx = x * scale, cy = y * scale;
            if (cx < o.minX) o.minX = cx;
            if (cx > o.maxX) o.maxX = cx;
            if (cy < o.minY) o.minY = cy;
            if (cy > o.maxY) o.maxY = cy;
            o.sumX += cx;
            o.sumY += cy;
          }
        }
        const result = { dpr, w: canvas.clientWidth, h: canvas.clientHeight };
        for (const key of Object.keys(out)) {
          const o = out[key];
          result[key] = o.n === 0
            ? { n: 0 }
            : { n: o.n, cx: +(o.sumX / o.n).toFixed(2), cy: +(o.sumY / o.n).toFixed(2),
                minX: +o.minX.toFixed(2), maxX: +o.maxX.toFixed(2),
                minY: +o.minY.toFixed(2), maxY: +o.maxY.toFixed(2) };
        }
        return result;
      },

      /* How much non-black ink is inside a horizontal band of the canvas (CSS px).
         This is how "the brush was really in transit between the slots" is
         asserted: a band that lies between the two slots is crossed mid-flight
         and empty once the stroke has arrived. */
      inkBand(y0, y1) {
        const w = canvas.width, h = canvas.height;
        if (!w || !h || !canvas.clientWidth) return 0;
        const data = ctx.getImageData(0, 0, w, h).data;
        const from = Math.max(0, Math.round(y0 * dpr));
        const to = Math.min(h, Math.round(y1 * dpr));
        let n = 0;
        for (let y = from; y < to; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (data[i + 3] < 64) continue;
            if (data[i] < 24 && data[i + 1] < 24 && data[i + 2] < 24) continue;  // black shell / disk
            n++;
          }
        }
        return n;
      },

      /* How much OPAQUE DARK ink is inside a box of the canvas (CSS px). A disk's
         glyph is drawn in black on top of it, so this is how "the lamp really
         carries its numeral/exclamation" is asserted: the box sits inside the
         disk, where the only dark pixels can be the glyph. */
      darkIn(x0, y0, x1, y1) {
        const w = canvas.width, h = canvas.height;
        if (!w || !h || !canvas.clientWidth) return 0;
        const data = ctx.getImageData(0, 0, w, h).data;
        const ix0 = Math.max(0, Math.round(x0 * dpr)), ix1 = Math.min(w, Math.round(x1 * dpr));
        const iy0 = Math.max(0, Math.round(y0 * dpr)), iy1 = Math.min(h, Math.round(y1 * dpr));
        let n = 0;
        for (let y = iy0; y < iy1; y++) {
          for (let x = ix0; x < ix1; x++) {
            const i = (y * w + x) * 4;
            if (data[i + 3] < 200) continue;
            // 90, not 0: the glyph's core is black but its antialiased edge is
            // not, and a thin stroke is mostly edge.
            if (data[i] < 90 && data[i + 1] < 90 && data[i + 2] < 90) n++;
          }
        }
        return n;
      },

      /* The pinned clock now runs the WHOLE presentation step, robot included:
         a robot assertion has to survive the same `pin`/`advance` discipline as
         a stroke assertion, or a real timer would overtake the frame under test. */
      pin(at) { pinned = at; robotStep(at); return true; },
      advance(dt) {
        pinned = (pinned === null ? now() : pinned) + dt;
        robotStep(pinned);
        return true;
      },
      hold(on) {
        held = !!on;
        if (held) { clearTimeout(finishTimer); finishTimer = 0; }
        return held;
      },
      frameAt(dt) {
        if (!model.flight) return false;
        pinned = model.flight.startedAt + dt;
        robotStep(pinned);
        return true;
      },
      replyAt(dt) {
        if (!model.reply) return false;
        pinned = model.reply.startedAt + dt;
        robotStep(pinned);
        return true;
      },
      /* Land the current flight/reply exactly, then run the next one. */
      settle() {
        if (model.flight) {
          pinned = model.flight.startedAt + FLIGHT_DURATION;
          finishFlight(model.flight);
        } else if (model.reply) {
          pinned = model.reply.startedAt + model.reply.duration;
          finishReply(model.reply);
        }
        robotStep(now());
        return true;
      },
      /* Drive the queue to its end at a pinned clock, so a terminal state can be
         asserted without waiting for real timers (which `hold` suppresses). */
      land() {
        held = true;
        clearTimeout(finishTimer);
        finishTimer = 0;
        for (let i = 0; i < 12; i++) {
          if (model.flight) {
            pinned = model.flight.startedAt + FLIGHT_DURATION;
            finishFlight(model.flight);
          } else if (model.reply) {
            pinned = model.reply.startedAt + model.reply.duration;
            finishReply(model.reply);
          } else if (model.pendingFlights.length > 0) {
            startNextFlight();
          } else {
            pinned = (pinned === null ? realNow() : pinned) + 2;
            robotStep(pinned);
            if (!model.layoutActive) break;
          }
        }
        model.layoutActive = false;
        robotStep(now());
        return true;
      },
      /* Back to an empty model, so each scenario starts from the same place
         instead of inheriting the previous fixture's running set. */
      reset() {
        model.rows = [];
        model.previousBusyIds = new Set();
        model.initialized = false;
        model.layout = layout(0, 0, 0, 0);
        model.from = layout(0, 0, 0, 0);
        model.target = layout(0, 0, 0, 0);
        model.flight = null;
        model.reply = null;
        model.pendingFlights = [];
        model.pendingReply = null;
        model.spin = null;
        model.layoutActive = false;
        model.retainedBusy = 0;
        model.retainedSuccess = 0;
        model.retainedFailure = 0;
        /* The robot has its own state machine beside the lamps', and a scenario
           that inherited the previous one's presence would be unreadable, so
           `reset` clears it too — including the director's clip clock. Visibility
           goes to 0 (not 1): the next frame decides whether the robot is on
           screen, and starting from "hidden, undecided" is the only value that
           makes both edges of the transition observable. */
        robot.idle = null;
        robot.display = null;
        robot.previous = null;
        robot.depart = false;
        robot.departFrom = null;
        robot.entryFrom = null;
        robot.entryAt = 0;
        robot.since = 0;
        robot.entryVisibility = 0;
        robot.visibility = 0;
        robot.live = false;
        robot.reason = 'reset';
        director.stop();
        /* A scenario starts from a running scheduler, or the robot would be a
           frozen silhouette until something else happened to start it. */
        if (!reduced()) director.start(true);
        clearTimeout(finishTimer);
        finishTimer = 0;
        pinned = null;
        render();
        return true;
      },
      /* The OS setting, forced from the page so the self-test is deterministic
         on a machine whose animations are switched off. */
      reduce(on) {
        model.probeReduce = !!on;
        /* Reduce Motion reaches the robot's scheduler directly — the same
           contract the host's `SPI_GETCLIENTAREAANIMATION` flag has. */
        director.setReduce(!!on);
        if (on) {
          model.flight = null;
          model.reply = null;
          model.pendingFlights = [];
          model.pendingReply = null;
          model.layoutActive = false;
          clearTimeout(finishTimer);
          finishTimer = 0;
          model.layout = model.target;
        }
        render();
        return model.probeReduce;
      },
      live() {
        pinned = null;
        tickLayout();
        render();
        wake();
        return true;
      },
      /* Park the whole status channel so the canvas holds the robot alone (see
         `render`). The self-test's departure check needs it: both inks are the
         same colour at the handover. */
      soloRobot(on) {
        model.probeSoloRobot = !!on;
        render();
        return model.probeSoloRobot;
      },
      /* Where the running pen is, as numbers: `RobotDeparture` parks it for the
         robot's full 1.22 s (`DecisionSpin.delay`), and "parked" is a claim about
         this position, not about a flag. */
      pen() {
        if (!model.spin) return { spin: false, parked: false, travelled: 0 };
        const at = now();
        const travelled = spinPosition(model.spin, at) - model.spin.angle;
        return {
          spin: true,
          delay: +model.spin.delay.toFixed(3),
          elapsed: +(at - model.spin.began).toFixed(3),
          travelled: +travelled.toFixed(4),
          parked: Math.abs(travelled) < 1e-6,
        };
      },

      /* What the CURRENT canvas holds, with the clock that painted it and what
         the robot's own state machine thinks it is: the only way to tell "this
         frame is wrong" apart from "the clock moved between the pin and the
         read". Written for the failure-flight and robot checks, which measure
         frames at a pinned phase. */
      snapshotOf() {
        const ink = this.ink();
        const la = model.layout;
        const w = (l) => `${l.top.toFixed(2)}/${l.middle.toFixed(2)}/${l.bottom.toFixed(2)}/${l.decision.toFixed(2)}`;
        const parts = [];
        for (const key of ['amber', 'green', 'red', 'blue', 'black', 'white']) {
          const c = ink[key];
          parts.push(key + '=' + (c && c.n ? c.n : 0));
        }
        return `canvas=${ink.w}x${ink.h} dpr=${ink.dpr} pinned=${pinned === null ? 'live' : pinned.toFixed(3)} `
          + `layout=${w(la)} target=${w(model.target)} `
          + `flight=${model.flight ? model.flight.outcome : '-'} `
          + `elapsed=${model.flight ? (now() - model.flight.startedAt).toFixed(3) : '-'} `
          + `ink[${parts.join(' ')}] `
          + `robot[ready=${RobotPose.ready} err=${RobotPose.error} running=${director.running} `
          + `action=${director.action} dLen=${robot.display && robot.display.d ? robot.display.d.length : 0} `
          + `live=${robot.live} vis=${robot.visibility.toFixed(3)} depart=${robot.depart} `
          + `departAt=${robot.departAt.toFixed(3)} entryAt=${robot.entryAt.toFixed(3)} since=${robot.since.toFixed(3)} `
          + `paint=${lastRobotPaint ? JSON.stringify(lastRobotPaint) : '-'} `
          + `reason=${robot.reason} shows=${showsRobot()} idle=${robot.idle}]`;
      },

      /* ---- Phase 5: the idle robot -------------------------------- */
      /* Everything the presence machine and the scheduler are doing, as numbers,
         so a failing assertion can be read instead of guessed at. */
      robot() {
        return {
          ready: RobotPose.ready,
          error: RobotPose.error,
          idle: robot.idle,
          shows: showsRobot(),
          visibility: +robot.visibility.toFixed(4),
          depart: robot.depart,
          departProgress: robot.depart
            ? +clamp01((now() - robot.departAt) / DEPARTURE_DURATION).toFixed(4) : null,
          entryProgress: robot.depart ? null
            : +clamp01((now() - (robot.entryAt - robot.since)) / 1.05).toFixed(4),
          entryFrom: !!robot.entryFrom,
          entryAt: +robot.entryAt.toFixed(3),
          entryVisibility: +robot.entryVisibility.toFixed(4),
          departAt: +robot.departAt.toFixed(3),
          live: robot.live,
          reason: robot.reason,
          display: !!robot.display,
          lastStatus: robot.lastStatus,
          action: director.action,
          actionElapsed: +(director.action ? now() - director.began : 0).toFixed(3),
          duration: director.duration,
          blend: !!director.blend,
          sleeping: director.asleep,
          reduceMotion: director.reduceMotion,
          lastStatusColor: robot.lastStatus,
          bbox: RobotPose.bbox(robot.display),
          birth: (() => {
            if (!model.flight && layTotal(model.layout) >= 0.0001) return null;
            const gate = 1 - clamp01((now() - robot.departAt) / DEPARTURE_DURATION);
            return statusBirth(gate);
          })(),
        };
      },

      /* Pixels of the robot's own palette inside the pill, with their bounding
         box. The EYES are a fixed ink, but the BODY is not: the dance clip cycles
         the pigment and the departure blends it towards the outgoing status
         colour, so `body` is matched against whatever the last frame actually
         painted (`lastRobotPaint.body`) — measured, not assumed. The eye
         reference is deliberately near-black, so a pixel has to be very close to
         it to count: the pure-black pill is excluded. */
      robotInk() {
        const w = canvas.width, h = canvas.height;
        if (!w || !h || !canvas.clientWidth) return { error: 'no-bitmap' };
        const refs = { body: hexRGB(lastRobotPaint && lastRobotPaint.body, [0.898, 0.898, 0.906]),
                       eye: [0.090, 0.090, 0.098] };
        const data = ctx.getImageData(0, 0, w, h).data;
        const scale = 1 / dpr;
        const out = { dpr: dpr, w: canvas.clientWidth, h: canvas.clientHeight,
                      bodyRef: lastRobotPaint ? lastRobotPaint.body : null, paint: lastRobotPaint };
        for (const key of Object.keys(refs)) {
          out[key] = { n: 0, minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9, cx: 0, cy: 0 };
        }
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const a = data[i + 3] / 255;
            if (a < 0.2) continue;
            const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
            let best = null, bestD = 1e9;
            for (const key of Object.keys(refs)) {
              const c = refs[key];
              const d = (r - c[0]) * (r - c[0]) + (g - c[1]) * (g - c[1]) + (b - c[2]) * (b - c[2]);
              if (d < bestD) { bestD = d; best = key; }
            }
            /* The eye reference is deliberately near-black, so a pixel has to be
               very close to it to count: the pure-black pill edge is excluded. */
            const limit = best === 'eye' ? 0.008 : 0.06;
            if (bestD > limit) continue;
            const o = out[best];
            o.n++;
            const cx = x * scale, cy = y * scale;
            if (cx < o.minX) o.minX = cx;
            if (cx > o.maxX) o.maxX = cx;
            if (cy < o.minY) o.minY = cy;
            if (cy > o.maxY) o.maxY = cy;
            o.cx += cx;
            o.cy += cy;
          }
        }
        for (const key of Object.keys(refs)) {
          const o = out[key];
          if (o.n === 0) { out[key] = { n: 0 }; continue; }
          out[key] = {
            n: o.n, cx: +(o.cx / o.n).toFixed(2), cy: +(o.cy / o.n).toFixed(2),
            minX: +o.minX.toFixed(2), maxX: +o.maxX.toFixed(2),
            minY: +o.minY.toFixed(2), maxY: +o.maxY.toFixed(2),
          };
        }
        out.eyesVisible = out.eye.n > 0;
        return out;
      },

      /* What the vendored renderer really wrote into the SVG DOM — the evidence
         that the engine is alive and that our parsing assumptions hold. */
      /* The last robot paint as numbers, plus how many frames have painted one —
         "the robot did not shrink" and "the robot was never asked to draw" need
         different answers. */
      paint() {
        return Object.assign({}, lastRobotPaint || { never: true },
          { renders: robot.renders || 0, resizes: robot.resizes || 0,
            lastRenderAt: robot.lastRenderAt, pinned: pinned });
      },

      robotEngine(clip, t) { return RobotPose.inspect(clip, t); },

      /* Drive the scheduler to an exact clip phase without waiting for a random
         5-10 s gap: the assertion is about the artwork, not about the dice. */
      robotAction(action, elapsed) {
        const clip = action === 'dance' ? 'dance' : action;
        return director.resume(clip, elapsed === undefined ? 0 : elapsed, null, now());
      },
      robotPlay(action) { return director.play(action, now()); },
      robotTryNext() { director.tryNext(); return director.action; },
      /* `carry`/`mix` are pure, so they can be asserted without a browser: the
         numbers behind "an interrupted transition keeps its velocity". */
      robotCarry(dt) {
        const t = now();
        const previous = director.buildPose(t - 1 / 240);
        const pose = director.buildPose(t);
        const carried = RobotPose.carry(pose, previous, dt);
        return {
          bbox: RobotPose.bbox(pose),
          carried: RobotPose.bbox(carried),
          moved: RobotPose.bbox(carried) && RobotPose.bbox(pose)
            ? +Math.hypot(RobotPose.bbox(carried).minX - RobotPose.bbox(pose).minX,
                          RobotPose.bbox(carried).minY - RobotPose.bbox(pose).minY).toFixed(3)
            : null,
        };
      },
    };

    /* The idle robot's renderer (OpenBotMotion, vendored byte-identical) is
       initialised up front but stays idle until no lamp is left. A failure here
       is not fatal: the page then simply paints the status lamps only. */
    if (!RobotPose.init({ clip: 'blink' })) robot.reason = 'no-renderer:' + RobotPose.error;

    render();

    return {
      snapshot,
      setMotion(on) {
        if (model.motion === on) return;
        model.motion = on;
        /* Reduce Motion holds the robot's scheduler too: no gestures, no blink,
           just the neutral pose (`IdleDirector.tick`, IdleRobot.swift:167). */
        director.setReduce(!on || model.probeReduce);
        if (reduced()) probe.reduce(true);
        else director.start(true);
        render();
        wake();
      },
      probe,
      get height() { return layHeight(model.layout); },
    };
  })();

  /* The probe surface the host's self-test and the --shot captures drive. It
     reports what was painted (canvas pixels) and lets a frame be pinned to an
     exact instant, which is what makes a motion assertion reproducible. */
  window.__notchOrbit = orbit;

  // ------------------------------------------------------------------
  // expanded: the session list
  // ------------------------------------------------------------------

  /* Row state precedence is the macOS if/else-if order verbatim
     (RootView.swift:1000-1019): busy → failed → needsAction → unread → idle.
     The pip colour and the trailing label both follow from it. */
  function rowState(row) {
    if (row.busy) return 'busy';
    if (row.failed) return 'failed';
    if (row.needsAction) return 'decision';
    if (row.completed) return 'completed';
    return 'idle';
  }

  /* A finished, not-yet-dismissed successful turn.
     `unread` is the ONLY source of truth here. An earlier version also accepted
     "the last turn succeeded and the row is idle", to paper over the Host's
     one-frame busy→idle lag (board.ts:111-113 refreshes its running set at the
     END of a snapshot, so a completion can arrive one frame late). That made every
     green lamp PERMANENT: after 「全部已读」 the Host correctly returns
     unread:false, but the turn still exists and is still successful, so the lamp
     came straight back and the button looked broken. Upstream's predicate is
     unread-first for the same reason (RootView.swift:150-152). */
  function isCompleted(row) {
    return !row.busy && !row.failed && !row.needsAction && row.unread === true;
  }

  function renderList(rows) {
    const key = JSON.stringify(rows.map(r => [
      r.id, r.title, r.busy, r.failed, r.needsAction, r.unread,
      r.lastTurn ? r.lastTurn.at : 0, r.approval ? r.approval.id : '',
      r.ask ? r.ask.id : '',
    ]));
    if (listEl.dataset.key === key) return;
    listEl.dataset.key = key;

    emptyEl.hidden = rows.length > 0;
    listEl.replaceChildren(...rows.map(row => {
      const state = rowState(row);
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'row ' + state;
      el.dataset.id = row.id;
      el.dataset.noDrag = '';           // clicking a row must not start a drag

      const pip = document.createElement('i');
      pip.className = 'pip';

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = row.title || row.id;

      el.append(pip, title);

      // Trailing label: busy rows say so, freshly completed rows say "完成"
      // (RootView.swift:1029-1037). Nothing else gets a label.
      if (state === 'busy') {
        const s = document.createElement('span');
        s.className = 'state busy';
        s.textContent = '运行中';
        el.append(s);
      } else if (state === 'completed' && row.unread) {
        const s = document.createElement('span');
        s.className = 'state completed';
        s.textContent = '完成';
        el.append(s);
      } else if (state === 'decision') {
        const s = document.createElement('span');
        s.className = 'state busy';
        s.textContent = '待回复';
        el.append(s);
      }

      return el;
    }));
  }

  function renderSnapshot(msg) {
    lastSnapshotAt = Date.now();
    offlineEl.hidden = true;

    const counts = msg.counts || {};

    // The compact pill has something to look at: upstream only scales the pill
    // content on hover when a status is on screen (RootView.swift:697).
    document.body.classList.toggle('hasstatus',
      ((counts.busy || 0) + (counts.completed || 0) + (counts.failed || 0) + (counts.decision || 0)) > 0);

    const rows = (msg.rows || []).map(row => Object.assign({}, row, {
      completed: isCompleted(row),
    }));
    lastRows = rows;
    // The status pill runs its own model: which running session finished, which
    // outcome flies where, and when a reply returns a task to the blue lamp
    // (RootView.swift:86-347). It is fed complete snapshots, like the Swift one.
    orbit.snapshot(rows);
    renderList(rows);
    renderWizard();

    badgeBusy.hidden = !(counts.busy > 0);
    badgeBusyN.textContent = (counts.busy || 0) + ' 进行中';
    badgeCompleted.hidden = !(counts.completed > 0);
    badgeCompletedN.textContent = (counts.completed || 0) + ' 完成';

    scheduleMeasure();
  }

  // ------------------------------------------------------------------
  // AskUserQuestion wizard (Phase 3)
  // ------------------------------------------------------------------

  /* The wizard is a straight port of the macOS AskWizard model
     (RootView.swift:43-525): per-question drafts, the first question that is not
     answered yet drives the index, a single-select chip answers AND advances, a
     multi-select chip accumulates, 完成 appears only where upstream shows it.

     Two deliberate departures, both because the platform differs:
       * the answer field asks the HOST for the keyboard (message "input"), since
         keystrokes follow the foreground window and this window is deliberately
         non-activating;
       * `showCustomField` is never toggled on: upstream's only toggle
         (toggleCustomField) is unreachable dead code — no view calls it — so a
         custom field appears exactly where upstream's does, namely on a question
         that has no options at all. */

  let wizard = null;      // { askId, sessionId, index, drafts: { qid: {...} } }
  let activeAsk = null;   // the ask currently on screen
  let customInput = null; // the answer field of the current step, if any
  let submitting = false;
  let answerFailed = false;

  const draftOf = (qid) => {
    let draft = wizard.drafts[qid];
    if (!draft) {
      draft = { selected: [], custom: '', skipped: false };
      wizard.drafts[qid] = draft;
    }
    return draft;
  };

  const isDone = (qid) => {
    const draft = draftOf(qid);
    return draft.skipped || draft.selected.length > 0 || draft.custom.trim() !== '';
  };

  const allDone = () => !!activeAsk && activeAsk.questions.every(q => isDone(q.id));

  /* The host makes the same decision (NotchWindow.LongDetailThreshold) and caps
     the window at the screen height when it is true. */
  const LONG_DETAIL = 240;
  const hasLongDetail = (ask) => ask.questions.some(q => (q.detail || '').length > LONG_DETAIL);

  function openWizard(row) {
    if (wizard && wizard.askId === row.ask.id) return;
    const drafts = {};
    row.ask.questions.forEach(q => { drafts[q.id] = { selected: [], custom: '', skipped: false }; });
    wizard = { askId: row.ask.id, sessionId: row.id, index: 0, drafts };
    submitting = false;
    answerFailed = false;
    errorEl.hidden = true;
  }

  function renderWizard() {
    const row = lastRows.find(r => r.ask && r.ask.questions && r.ask.questions.length > 0);
    if (!row) {
      // The question is gone: the Host folds the capsule by itself. The wizard
      // must not stay on screen with a stale question.
      activeAsk = null;
      wizard = null;
      customInput = null;
      document.body.classList.remove('wizard', 'long-detail');
      wizardEl.dataset.key = '';
      return;
    }

    openWizard(row);
    activeAsk = row.ask;
    document.body.classList.add('wizard');
    document.body.classList.toggle('long-detail', hasLongDetail(activeAsk));

    const count = activeAsk.questions.length;
    const index = Math.min(wizard.index, count - 1);
    wizard.index = index;
    const question = activeAsk.questions[index];
    const draft = draftOf(question.id);
    const options = question.options || [];
    const showInput = options.length === 0 || wizard.showCustom === true;
    const last = index === count - 1;
    const completeMode = last && (question.multiSelect === true || options.length === 0
      || draft.custom.trim() !== '');
    const navMode = completeMode ? 'complete' : (last || count === 1 ? 'none' : 'next');

    const key = [wizard.askId, index, showInput ? 1 : 0, navMode,
      options.map(o => o.label).join('\u0001')].join('|');
    if (wizardEl.dataset.key !== key) {
      wizardEl.dataset.key = key;
      buildWizardDom(question, options, showInput, index, count, navMode);
    }

    syncWizardState();
  }

  function buildWizardDom(question, options, showInput, index, count, navMode) {
    titleEl.textContent = question.question;
    counterEl.textContent = count > 1 ? (index + 1) + '/' + count : '';
    counterEl.hidden = count <= 1;

    detailEl.replaceChildren();
    if (question.detail) renderMarkdown(detailEl, question.detail);

    chipsEl.replaceChildren();
    options.forEach(option => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.noDrag = '';
      chip.dataset.label = option.label;

      const label = document.createElement('span');
      label.className = 'chip-label';
      label.textContent = option.label;
      chip.append(label);

      if (option.description) {
        const desc = document.createElement('span');
        desc.className = 'chip-desc';
        desc.textContent = option.description;
        chip.append(desc);
      }

      chipsEl.append(chip);
    });

    customInput = null;
    if (showInput) {
      customInput = document.createElement('input');
      customInput.className = 'w-input';
      customInput.type = 'text';
      customInput.placeholder = '输入你的答案';
      customInput.dataset.noDrag = '';
      customInput.maxLength = 4000;
      customInput.addEventListener('input', onCustomInput);
      customInput.addEventListener('keydown', onCustomKey);
      customInput.addEventListener('focusin', () => send({ type: 'input', focused: true }));
      customInput.addEventListener('focusout', () => send({ type: 'input', focused: false }));
      chipsEl.append(customInput);
    }

    prevBtn.hidden = count <= 1;
    prevBtn.disabled = index === 0;
    nextBtn.hidden = navMode === 'none';
    nextBtn.textContent = navMode === 'complete' ? '完成' : '下一题';
  }

  /* Brings the DOM in line with the drafts WITHOUT rebuilding it. This is what
     keeps the caret in the answer field while the user types, and what updates
     the chip highlight after a multi-select tap. */
  function syncWizardState() {
    if (!activeAsk || !wizard) return;

    const question = activeAsk.questions[wizard.index];
    const draft = draftOf(question.id);

    for (const chip of chipsEl.querySelectorAll('.chip')) {
      chip.classList.toggle('on', draft.selected.indexOf(chip.dataset.label) >= 0);
    }

    if (customInput && document.activeElement !== customInput && customInput.value !== draft.custom) {
      customInput.value = draft.custom;
    }

    // 完成 (and only 完成) is gated on every question being answered
    // (RootView.swift:927-931).
    if (nextBtn.textContent === '完成') nextBtn.disabled = !allDone();
    prevBtn.disabled = wizard.index === 0;

    errorEl.hidden = !answerFailed;
    if (answerFailed) errorEl.textContent = '提交失败，请重试；也可以在 DSH 中回答。';
  }

  function tapOption(label) {
    if (!activeAsk || !wizard) return;

    const count = activeAsk.questions.length;
    const question = activeAsk.questions[wizard.index];
    const draft = draftOf(question.id);

    if (question.multiSelect === true) {
      const at = draft.selected.indexOf(label);
      if (at >= 0) draft.selected.splice(at, 1);
      else draft.selected.push(label);
      draft.skipped = false;
    } else {
      // Picking an option replaces a typed answer (RootView.swift:431-434).
      draft.selected = [label];
      draft.custom = '';
      draft.skipped = false;
    }

    wizard.showCustom = false;
    if (question.multiSelect !== true && wizard.index < count - 1) wizard.index++;

    renderWizard();

    // A single-select tap answers the question, so the moment the LAST one is
    // answered the whole ask is submitted without another click
    // (RootView.swift:442-444).
    if (question.multiSelect !== true && allDone()) submitWizard();
  }

  function onCustomInput(event) {
    if (!activeAsk || !wizard) return;
    const question = activeAsk.questions[wizard.index];
    const draft = draftOf(question.id);
    draft.custom = event.target.value;
    draft.skipped = false;
    if (question.multiSelect !== true) draft.selected = [];
    syncWizardState();
  }

  function onCustomKey(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    if (allDone()) submitWizard();
  }

  /* Builds the answer body (src/types.ts:56-60) exactly as upstream does
     (RootView.swift:505-515) and hands it to the host, which owns the token. */
  function submitWizard() {
    if (!activeAsk || !wizard || submitting || !allDone()) return;

    submitting = true;
    answerFailed = false;
    errorEl.hidden = true;

    const answers = activeAsk.questions.map(question => {
      const draft = draftOf(question.id);
      if (draft.skipped) return { id: question.id, selected: [] };
      const custom = draft.custom.trim();
      const item = {
        id: question.id,
        // A typed answer replaces the options for a single-select question, and
        // accompanies them for a multi-select one.
        selected: custom === '' || question.multiSelect === true ? draft.selected.slice() : [],
      };
      if (custom !== '') item.custom = custom;
      return item;
    });

    send({ type: 'answer', id: wizard.askId, answers });
  }

  titleEl.addEventListener('click', () => {
    // Same gesture as clicking a row: mark seen and ask DSH to show the session.
    if (wizard) send({ type: 'open', id: wizard.sessionId });
  });

  chipsEl.addEventListener('click', (event) => {
    const chip = event.target.closest ? event.target.closest('.chip') : null;
    if (chip) tapOption(chip.dataset.label);
  });

  prevBtn.addEventListener('click', () => {
    if (!wizard || wizard.index <= 0) return;
    wizard.index--;
    renderWizard();
  });

  nextBtn.addEventListener('click', () => {
    if (!wizard || !activeAsk) return;
    if (nextBtn.textContent === '完成') {
      submitWizard();
      return;
    }
    if (wizard.index < activeAsk.questions.length - 1) {
      wizard.index++;
      renderWizard();
    }
  });

  // ------------------------------------------------------------------
  // markdown — a port of macos/Sources/NotchMarkdown.swift
  // ------------------------------------------------------------------

  /* Ported rather than pulled in as a library: the capsule is offline (no CDN,
     no bundler) and upstream's renderer is the reference the macOS build is
     judged against. Every node is built with textContent — never innerHTML —
     because a question detail is untrusted text and must not be able to inject
     markup into the capsule. */

  const MD_INLINE = /(`[^`]+`)|(\*\*[^*]+\*\*)|(__[^_]+__)|(\*[^*]+\*)|(_[^_]+_)|(\[[^\]]+\]\([^)\s]+\))/g;

  function mdInline(text) {
    const fragment = document.createDocumentFragment();
    let last = 0;
    let match;
    MD_INLINE.lastIndex = 0;
    while ((match = MD_INLINE.exec(text)) !== null) {
      if (match.index > last) fragment.append(text.slice(last, match.index));
      const token = match[0];

      if (token.charAt(0) === '`') {
        const code = document.createElement('code');
        code.textContent = token.slice(1, -1);
        fragment.append(code);
      } else if (token.startsWith('**') || token.startsWith('__')) {
        const strong = document.createElement('strong');
        strong.textContent = token.slice(2, -2);
        fragment.append(strong);
      } else if (token.charAt(0) === '[') {
        // Rendered as a label, not a link: the host cancels any navigation away
        // from the capsule, so an <a href> here could only ever do nothing.
        const link = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(token);
        const span = document.createElement('span');
        span.className = 'md-a';
        span.textContent = link ? link[1] : token;
        span.title = link ? link[2] : '';
        fragment.append(span);
      } else {
        const em = document.createElement('em');
        em.textContent = token.slice(1, -1);
        fragment.append(em);
      }

      last = match.index + token.length;
    }

    if (last < text.length) fragment.append(text.slice(last));
    return fragment;
  }

  function mdHeading(line) {
    if (line.charAt(0) !== '#') return null;
    let level = 0;
    while (level < line.length && line.charAt(level) === '#') level++;
    if (level === 0 || level > 6 || line.length <= level || line.charAt(level) !== ' ') return null;
    return { type: 'heading', level, text: line.slice(level + 1) };
  }

  const mdTrim = (line) => line.trim();

  function mdIsDivider(line) {
    const text = mdTrim(line);
    if (text.charAt(0) !== '|') return false;
    return text.replace(/\|/g, '').replace(/:/g, '').replace(/-/g, '').replace(/\s/g, '') === '';
  }

  function mdCells(line) {
    const parts = line.split('|').map(part => part.trim());
    if (parts.length && parts[0] === '') parts.shift();
    if (parts.length && parts[parts.length - 1] === '') parts.pop();
    return parts;
  }

  const mdIsBullet = (line) => line.startsWith('- ') || line.startsWith('* ');

  function mdOrderedItem(line) {
    const dot = line.indexOf('.');
    if (dot <= 0) return null;
    const number = line.slice(0, dot);
    if (!/^\d+$/.test(number)) return null;
    const rest = line.slice(dot + 1);
    return rest.charAt(0) === ' ' ? rest.slice(1) : null;
  }

  const mdIsOrdered = (line) => mdOrderedItem(line) !== null;

  function mdBlocks(source) {
    const lines = String(source).replace(/\r\n/g, '\n').split('\n');
    const blocks = [];
    let i = 0;

    while (i < lines.length) {
      const line = mdTrim(lines[i]);
      if (line === '') { i++; continue; }

      if (line.startsWith('```')) {
        i++;
        const body = [];
        while (i < lines.length && !mdTrim(lines[i]).startsWith('```')) { body.push(lines[i]); i++; }
        if (i < lines.length) i++;
        blocks.push({ type: 'code', text: body.join('\n') });
        continue;
      }

      if (line === '---' || line === '***' || line === '___') {
        blocks.push({ type: 'rule' });
        i++;
        continue;
      }

      const heading = mdHeading(line);
      if (heading) { blocks.push(heading); i++; continue; }

      if (line.charAt(0) === '|' && i + 1 < lines.length && mdIsDivider(lines[i + 1])) {
        const headers = mdCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && mdTrim(lines[i]).charAt(0) === '|') { rows.push(mdCells(lines[i])); i++; }
        blocks.push({ type: 'table', headers, rows });
        continue;
      }

      if (line.startsWith('> ') || line === '>') {
        const quoted = [];
        while (i < lines.length) {
          const text = mdTrim(lines[i]);
          if (text.startsWith('> ')) quoted.push(text.slice(2));
          else if (text === '>') quoted.push('');
          else break;
          i++;
        }
        blocks.push({ type: 'quote', text: quoted.join('\n') });
        continue;
      }

      if (mdIsBullet(line) || mdIsOrdered(line)) {
        const ordered = mdIsOrdered(line);
        const items = [];
        while (i < lines.length) {
          const text = mdTrim(lines[i]);
          const item = ordered ? mdOrderedItem(text) : (mdIsBullet(text) ? text.slice(2) : null);
          if (item === null) break;
          items.push(item);
          i++;
        }
        blocks.push({ type: 'list', items, ordered });
        continue;
      }

      const paragraph = [line];
      i++;
      while (i < lines.length) {
        const text = mdTrim(lines[i]);
        if (text === '' || text.charAt(0) === '#' || text.charAt(0) === '|' || text.startsWith('```')
          || text.startsWith('> ') || mdIsBullet(text) || mdIsOrdered(text) || text === '---') break;
        paragraph.push(text);
        i++;
      }
      blocks.push({ type: 'paragraph', text: paragraph.join(' ') });
    }

    return blocks;
  }

  function renderMarkdown(container, source) {
    for (const block of mdBlocks(source)) {
      if (block.type === 'heading') {
        const level = Math.min(block.level, 3);
        const heading = document.createElement('h' + level);
        heading.append(mdInline(block.text));
        container.append(heading);
        continue;
      }

      if (block.type === 'paragraph') {
        const paragraph = document.createElement('p');
        paragraph.append(mdInline(block.text));
        container.append(paragraph);
        continue;
      }

      if (block.type === 'list') {
        const list = document.createElement(block.ordered ? 'ol' : 'ul');
        block.items.forEach((item, index) => {
          const li = document.createElement('li');
          const marker = document.createElement('span');
          marker.className = 'md-marker';
          marker.textContent = block.ordered ? (index + 1) + '.' : '•';
          const body = document.createElement('span');
          body.append(mdInline(item));
          li.append(marker, body);
          list.append(li);
        });
        container.append(list);
        continue;
      }

      if (block.type === 'table') {
        const table = document.createElement('table');
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        block.headers.forEach(cell => {
          const th = document.createElement('th');
          th.append(mdInline(cell));
          headRow.append(th);
        });
        head.append(headRow);
        table.append(head);

        const body = document.createElement('tbody');
        block.rows.forEach(cells => {
          const row = document.createElement('tr');
          cells.forEach(cell => {
            const td = document.createElement('td');
            td.append(mdInline(cell));
            row.append(td);
          });
          body.append(row);
        });
        table.append(body);
        container.append(table);
        continue;
      }

      if (block.type === 'code') {
        const pre = document.createElement('pre');
        pre.textContent = block.text;
        container.append(pre);
        continue;
      }

      if (block.type === 'quote') {
        const quote = document.createElement('blockquote');
        quote.append(mdInline(block.text));
        container.append(quote);
        continue;
      }

      if (block.type === 'rule') container.append(document.createElement('hr'));
    }
  }

  // ------------------------------------------------------------------
  // content height reporting
  // ------------------------------------------------------------------

  /* The panel hugs its content (RootView.swift:576-583), and the page is the
     only side that knows how the rows actually wrapped. The reported value is
     the intrinsic height of the list's contents, which does NOT depend on the
     viewport — so the window resizing cannot feed back into the measurement and
     start an oscillation. */
  /* The intrinsic height of a column of blocks: the sum of the children plus the
     gaps between them.
     Reading `scrollHeight` instead would be wrong for anything with a flexible
     child: scrollHeight is never smaller than the element's own client height, so
     a `flex:1` list reports the CURRENT panel height back to the host — the panel
     would then never shrink to its content and would keep whatever height it had
     (visible as a black band under the last row). Summing the boxes has no such
     self-reference. */
  function contentHeight(el, gap) {
    const kids = [...el.children];
    if (kids.length === 0) return 0;
    let total = 0;
    for (const kid of kids) total += kid.getBoundingClientRect().height;
    return Math.ceil(total + gap * (kids.length - 1));
  }

  function measure() {
    if (!expanded) return;

    const chrome = 28;                 // #panel padding, top+bottom
    const gap = 12;                    // #panel gap between its blocks
    const blocks = [];

    if (activeAsk) {
      // A long detail is not measured at all: the host caps the window at the
      // screen height and the detail scrolls inside it, so measuring here would
      // only fight that decision.
      if (hasLongDetail(activeAsk)) return;
      blocks.push(contentHeight(wizardEl, 10));
      if (!errorEl.hidden) blocks.push(errorEl.offsetHeight);
    } else {
      // The badge ROW, not one badge inside it: the row is what the panel lays
      // out, and it is as tall as its tallest child (the clear button). Measuring
      // a single badge left the panel 8 px short of its own content — enough for
      // the list to overflow and paint a scrollbar thumb beside one row of text.
      if (!badgesEl.hidden) blocks.push(badgesEl.getBoundingClientRect().height);
      blocks.push(listEl.children.length === 0 ? emptyEl.offsetHeight : contentHeight(listEl, 4));
    }

    const content = blocks.reduce((sum, height) => sum + height, 0)
      + gap * Math.max(0, blocks.length - 1);
    const rounded = Math.round(chrome + content);

    // Re-measuring mid-bloom would fight the host's animation; the one value the
    // host's settle handler reads is the final one.
    if (!settled) return;

    // A 1 px difference is not worth a 400 ms animation. 4 px is above font
    // metric noise and below anything visible.
    if (Math.abs(rounded - reportedHeight) < 4) return;
    reportedHeight = rounded;

    // `rounded` is CSS pixels (that is what the DOM reports); the host sizes the
    // window in physical pixels. See panelScale.
    send({ type: 'height', value: Math.round(rounded * panelScale) });
  }

  /* Measures now, and again shortly after.
     The first frame after a snapshot can be measured before every box has
     reached its final height — a row that grows once its label is laid out, a
     scrollbar appearing, a table sizing itself. The 4 px gate below then keeps
     that early value on screen, which showed up as a list box a few pixels
     shorter than its only row (and therefore a scrollbar thumb next to a single
     line of text). The second pass is unconditional; the host ignores a height it
     already has, so a stable layout costs one no-op message. */
  let measureTimer = 0;

  function scheduleMeasure() {
    requestAnimationFrame(measure);
    clearTimeout(measureTimer);
    measureTimer = setTimeout(() => { reportedHeight = 0; measure(); }, 160);
  }

  // ------------------------------------------------------------------
  // interactions
  // ------------------------------------------------------------------

  // A press on interactive chrome (rows, buttons — anything marked data-no-drag)
  // must not start a window drag.
  const isInteractive = (el) => !!(el && el.closest && el.closest('[data-no-drag]'));

  shell.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || isInteractive(e.target)) return;
    send({ type: 'press' });
  });

  // The edge-switch gesture (double-click) is detected by the host from click
  // timestamps, not here: the first click of a pair resizes the window, so the
  // second one hits a different node and dblclick would never fire while the
  // capsule is collapsed.
  shell.addEventListener('contextmenu', (e) => {
    if (isInteractive(e.target)) return;
    e.preventDefault();
    send({ type: 'reset' });
  });

  shell.addEventListener('dragstart', (e) => e.preventDefault());

  listEl.addEventListener('click', (e) => {
    const row = e.target.closest ? e.target.closest('.row') : null;
    if (!row) return;
    // Row click = dismiss this session's unread lamp and ask DSH to show it
    // (upstream model.pick, RootView.swift:349-374). The host performs both
    // requests: the page never holds the token.
    send({ type: 'open', id: row.dataset.id });
  });

  document.getElementById('clear').addEventListener('click', () => {
    send({ type: 'seen' });            // POST /seen {all:true}
  });

  if (host) {
    host.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'geometry') {
        const wasExpanded = expanded;
        expanded = !!msg.expanded;
        const wasSettled = settled;
        settled = msg.settled !== false;

        document.body.classList.toggle('expanded', expanded);
        // Mirror the rounded corners to whichever edge is attached, and match
        // the host's clip radius so the page's antialiasing lines up with it.
        if (msg.edge) document.body.classList.toggle('edge-left', msg.edge === 'left');
        if (msg.radius) document.documentElement.style.setProperty('--radius', msg.radius + 'px');

        // The shell is laid out at its full CSS size and CLIPPED by the window, so
        // this is the panel width (480 pt) — a constant, converted from the
        // physical pixels the host reports. If it tracked the animated window
        // width instead, the text would re-wrap every frame, and since the panel's
        // height is measured from that text, the page's own measurement would
        // drive the window in a loop.
        if (msg.width) {
          document.documentElement.style.setProperty('--panel-w', toCssPx(msg.width, msg.scale) + 'px');
        }
        if (msg.scale > 0) panelScale = msg.scale;
        if (msg.hovered !== undefined) document.body.classList.toggle('hovered', !!msg.hovered);
        // Reduce Motion is a host setting (SPI_GETCLIENTAREAANIMATION), so the
        // page follows it instead of guessing: no flight, no spin, terminal state
        // straight away (STATUS-MOTION.md:5).
        if (msg.motion !== undefined) orbit.setMotion(!!msg.motion);

        if (!wasExpanded && expanded) {
          reportedHeight = 0;
          scheduleMeasure();
        } else if (expanded && (!wasSettled && settled)) {
          // The bloom has landed: now the measurement is worth taking.
          scheduleMeasure();
        }
      }

      if (msg.type === 'hover') document.body.classList.toggle('hovered', !!msg.hovered);

      // The host can see state changes the page cannot (automation expanded the
      // capsule from the outside), so it asks for a fresh measurement.
      if (msg.type === 'measure') {
        reportedHeight = 0;
        scheduleMeasure();
      }

      if (msg.type === 'snapshot') renderSnapshot(msg);

      // The host is the only side that knows whether POST /answer was accepted.
      // Without these two the wizard would either lock up after one submission or
      // silently look unanswered (upstream sets actionError for the same reason,
      // RootView.swift:519-523).
      if (msg.type === 'answer-ok') {
        submitting = false;
      }

      if (msg.type === 'answer-failed') {
        submitting = false;
        answerFailed = true;
        syncWizardState();
        scheduleMeasure();
      }
    });
  }

  // Lets the host confirm the page is alive and the bridge works, instead of
  // guessing from the outside; the host answers with the current geometry, the
  // hover state and the newest snapshot.
  send({ type: 'ready' });

  // The status line turns honest when the data stops: the macOS build shows the
  // same kind of "等待 Host…" state (RootView.swift:177-180).
  setInterval(() => {
    if (!lastSnapshotAt) return;
    const stale = Date.now() - lastSnapshotAt > 8000;
    offlineEl.hidden = !stale;
  }, 2000);

  // Fallback so the shape is never wrong if a state message is missed during
  // startup. The host resends geometry on "ready", so this only covers a host
  // that died before answering.
  const sync = () => {
    if (document.documentElement.dataset.gotGeometry) return;
    document.body.classList.toggle('expanded', window.innerWidth > 120);
  };
  new ResizeObserver(sync).observe(document.documentElement);
  sync();
</script>
</body>
</html>
